name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Triggert zodra je naar main pusht

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build Project (TypeScript to JS)
      run: npm run build
      # Webpack genereert nu de 'dist/' map op de runner

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: dist # De inhoud van de dist-map wordt naar de 'gh-pages' branch gepusht
        branch: gh-pages
